name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios-dual-boot-source.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir project
          unzip ios-dual-boot-source.zip -d project
          find project -maxdepth 3 -type f | head -40

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd project
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ios-dual-boot-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          
